name: Fork iOS

# Production iOS build submitted to TestFlight. Called by fork-release.yml
# after a nightly is published, so TestFlight only receives commits that
# shipped as a nightly. The build runs locally on this runner (`eas build
# --local`) to spend no EAS build credits; EAS still supplies the signing
# credentials, the remote build number, and the App Store Connect API key for
# submission. Skipped when EXPO_TOKEN is not set. See FORK.md "Mobile releases".

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build and submit
    # macos-26 tops out at Xcode 26.x; Xcode 27 ships on its own preview image.
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      APP_VARIANT: production
      NODE_OPTIONS: --max-old-space-size=8192
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      # Profile repair with the EAS-stored API key otherwise assumes an
      # organization team.
      EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
    steps:
      - id: expo-token
        name: Check for EXPO_TOKEN
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::EXPO_TOKEN is not set; skipping the TestFlight build."
          fi

      - name: Checkout
        if: steps.expo-token.outputs.present == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          # No sparse-checkout: eas-cli archives the project with a local
          # `git clone`, which fails on a partial clone.

      # Matches the Xcode of the EAS image pinned in eas.json.
      - name: Select Xcode
        if: steps.expo-token.outputs.present == 'true'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.1"

      - name: Setup Vite+
        if: steps.expo-token.outputs.present == 'true'
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/mobile...

      - name: Expose pnpm
        if: steps.expo-token.outputs.present == 'true'
        run: |
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          vp_pnpm_bin="$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin"
          echo "$vp_pnpm_bin" >> "$GITHUB_PATH"
          "$vp_pnpm_bin/pnpm" --version

      - name: Setup EAS
        if: steps.expo-token.outputs.present == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          # The action installs eas-cli into its own tool dir; pnpm 11 fails
          # that install on dtrace-provider's ignored build script.
          packager: npm

      - name: Build
        if: steps.expo-token.outputs.present == 'true'
        working-directory: apps/mobile
        run: eas build --local --platform ios --profile production --non-interactive --output "$RUNNER_TEMP/kinako.ipa"

      - name: Submit to TestFlight
        if: steps.expo-token.outputs.present == 'true'
        working-directory: apps/mobile
        run: eas submit --platform ios --profile production --path "$RUNNER_TEMP/kinako.ipa" --non-interactive
