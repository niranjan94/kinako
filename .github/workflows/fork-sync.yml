name: Fork sync

# Keeps `main` an exact mirror of upstream and opens a pull request merging it
# into `fork/main`. See FORK.md.
#
# Needs the FORK_SYNC_TOKEN secret: a fine-grained token for this repository
# with Contents, Workflows, and Pull requests write access. The default
# GITHUB_TOKEN cannot push commits that touch .github/workflows, and upstream
# changes them constantly.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync upstream
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require sync token
        env:
          FORK_SYNC_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
        run: |
          if [[ -z "$FORK_SYNC_TOKEN" ]]; then
            echo "::error::Set the FORK_SYNC_TOKEN secret (see FORK.md)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: fork/main
          fetch-depth: 0
          token: ${{ secrets.FORK_SYNC_TOKEN }}

      - name: Mirror upstream main
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch --no-tags upstream main
          git fetch --no-tags origin main
          # main must never carry fork commits; refuse rather than drop them.
          if ! git merge-base --is-ancestor origin/main upstream/main; then
            echo "::error::origin/main has commits that are not in upstream/main. Move them to fork/main by hand."
            exit 1
          fi
          git push origin upstream/main:refs/heads/main
          echo "main is at $(git rev-parse --short upstream/main)"

      # Merging main into fork/main is left to a person: conflicts with fork
      # changes show up on the PR and get resolved there, and fork/main is
      # never rewritten. An open PR picks up new upstream commits on its own.
      - name: Open sync pull request
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "fork/main already contains upstream/main."
            exit 0
          fi
          open="$(gh pr list --repo "$GITHUB_REPOSITORY" --base fork/main --head main --state open --json url --jq '.[0].url')"
          if [[ -n "$open" ]]; then
            echo "Sync pull request already open: $open"
            exit 0
          fi
          gh pr create --repo "$GITHUB_REPOSITORY" --base fork/main --head main \
            --title "chore(fork): sync upstream" \
            --body "Merges upstream \`main\` into \`fork/main\`. Merge with a merge commit, never squash or rebase, so later syncs only bring new upstream commits. See FORK.md for resolving conflicts."
