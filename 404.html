<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <title>Kinako</title>
    <style>
      :root {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #1f1b16;
        background: #faf7f2;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color: #ece6dc;
          background: #16130f;
        }
        .muted {
          color: #a39a8c;
        }
        .secondary {
          border-color: #3a342c;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      main {
        max-width: 26rem;
        padding: 2rem 1.5rem;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0 0 1.5rem;
        line-height: 1.5;
      }
      .muted {
        color: #6b6256;
        font-size: 0.875rem;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }
      a.button {
        display: inline-block;
        padding: 0.55rem 1rem;
        border-radius: 0.5rem;
        font-size: 0.875rem;
        font-weight: 500;
        text-decoration: none;
        background: #b5803a;
        color: #fff;
      }
      a.secondary {
        background: transparent;
        color: inherit;
        border: 1px solid #ddd4c6;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main>
      <section id="thread" hidden>
        <h1>Open this thread</h1>
        <p class="muted">It opens in Kinako if you're connected to the machine it runs on.</p>
        <div class="actions">
          <a id="open" class="button" href="#">Open in Kinako</a>
          <a class="button secondary" href="https://github.com/niranjan94/kinako/releases">Get Kinako</a>
        </div>
      </section>
      <section id="missing" hidden>
        <h1>Page not found</h1>
        <p class="muted">This address isn't a Kinako thread link.</p>
      </section>
    </main>
    <script>
      // Segments stay percent-encoded, as the desktop and mobile apps expect them in a kinako:// link.
      const match = /^\/threads\/([A-Za-z0-9_%-]+)\/([A-Za-z0-9_%-]+)\/?$/.exec(location.pathname);
      if (match) {
        document.getElementById("open").href = `kinako://threads/${match[1]}/${match[2]}`;
        document.getElementById("thread").hidden = false;
        document.title = "Open thread · Kinako";
      } else {
        document.getElementById("missing").hidden = false;
      }
    </script>
  </body>
</html>
